name: EduForge360 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    name: Code Quality & Syntax Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, gd, zip
          tools: composer:v2, phpcs

      - name: Check PHP Syntax (Parallel Lint)
        run: |
          echo "Linting all PHP files in custom theme and plugin..."
          find wp-content/ -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l

      - name: Check WordPress Coding Standards (PHPCS)
        run: |
          composer global require "wp-coding-standards/wpcs"
          phpcs --config-set installed_paths $(composer global config home)/vendor/wp-coding-standards/wpcs
          echo "Running PHPCS on custom plugin and theme (errors only)..."
          phpcs -n -s --standard=WordPress-Core wp-content/plugins/edu-forge-core wp-content/themes/edu-forge-theme || true

      - name: Security Audit for Credentials & Dangerous Functions
        run: |
          echo "Scanning for accidental hardcoded credentials or passwords..."
          ! grep -rnwi "password\s*=\s*['\"][a-zA-Z0-9_-]\{8,\}['\"]" wp-content/ || exit 1
          echo "Credential check passed."

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t eduforge360:ci -f docker/Dockerfile .
